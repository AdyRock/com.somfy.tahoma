<style>
html,
body
{
height: 100%;
}

.login-page
{
display: flex;
flex-direction: column;
height: 100%;
gap: 14px;
}

.login-logo-wrap
{
display: flex;
justify-content: center;
margin-top: 2px;
}

.login-logo
{
width: 80px;
height: 80px;
object-fit: contain;
}

.login-title
{
text-align: center;
font-size: 20px;
line-height: 1.1;
font-weight: 700;
margin: 2px 0 8px;
}

.login-form
{
display: flex;
flex-direction: column;
flex: 1;
}

.login-fields
{
display: flex;
flex-direction: column;
gap: 10px;
}

.login-submit
{
margin-top: auto;
}
</style>

<div class="login-page">
<div class="login-logo-wrap">
<img class="login-logo" src="logo.png" alt="Somfy" />
</div>
<h2 class="login-title">Sign in with your credentials</h2>

<form class="homey-form login-form" id="login_form" name="login_form" action="javascript:void(0);" method="post">
<div class="login-fields">
<label class="homey-form-label" for="username" data-i18n="settings.username"></label>
<input class="homey-form-input" id="username" name="username" type="email" placeholder="john@doe.com" required />

<label class="homey-form-label" for="password" data-i18n="settings.password"></label>
<input class="homey-form-input" id="password" name="password" type="password" data-i18n-placeholder="settings.password" required />

<label class="homey-form-label" for="region" data-i18n="pair.select_region.region"></label>
<select class="homey-form-select" name="region" id="region" title="Region">
<option value="europe" data-i18n="pair.select_region.europe"></option>
<option value="usa" data-i18n="pair.select_region.usa"></option>
<option value="oceana" data-i18n="pair.select_region.oceana"></option>
</select>
</div>

<button class="homey-button-primary-full login-submit" type="submit">Sign in</button>
</form>
</div>

<script type="text/javascript">
Homey.setTitle('');

function showError(err)
{
const message = err && err.message ? err.message : String(err || 'Unknown error');
Homey.alert(message, 'error');
}

Homey.emit('select_region_setup', {}, function(err, result)
{
if (err)
{
showError(err);
return;
}

if (result && result.region)
{
document.getElementById('region').value = result.region;
}
});

document.getElementById('login_form').addEventListener('submit', function(event)
{
event.preventDefault();

const username = document.getElementById('username').value;
const password = document.getElementById('password').value;
const region = document.getElementById('region').value;

Homey.emit('login', { username, password, region }, function(err, result)
{
if (err)
{
showError(err);
return;
}

if (!result)
{
Homey.alert(__('errors.on_pair_login_failure'), 'error');
return;
}

Homey.showView('list_my_devices');
});
});
</script>

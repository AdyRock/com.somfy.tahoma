<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Somfy TaHoma Settings</title>
	<link rel="stylesheet" type="text/css" href="busy_indicator.css" />

	<style type="text/css">
		.fog_div {
			display: none;
			position: fixed;
			top: 0px;
			left: 0px;
			height: 100%;
			width: 100%;
			z-index: 100;
			background-color: rgba(30, 30, 30, 0.5);
		}

		#busybox.show {
			display: block;
		}

		.is-hidden {
			display: none;
		}

		button.btn-clear {
			background-color: #dff3e6 !important;
			color: #1f4d2e !important;
			border: 1px solid #a8d5ba !important;
			margin: 5px 20px 5px 5px;
			box-shadow: none !important;
			opacity: 1 !important;
			-webkit-appearance: none;
			appearance: none;
		}

		button.btn-send {
			background-color: #cdebd8 !important;
			color: #123a23 !important;
			border: 1px solid #97c9aa !important;
			margin: 5px 20px 5px 5px;
			box-shadow: none !important;
			opacity: 1 !important;
			-webkit-appearance: none;
			appearance: none;
		}

		button.btn-clear:hover {
			background-color: #cfead8 !important;
		}

		button.btn-send:hover {
			background-color: #b9e1c9 !important;
		}

		.homey-button-primary-full,
		.homey-button-danger-shadow {
			background-color: #cdebd8 !important;
			color: #123a23 !important;
			border: 1px solid #97c9aa !important;
			box-shadow: none !important;
		}

		.homey-button-primary-full:hover,
		.homey-button-danger-shadow:hover {
			background-color: #b9e1c9 !important;
		}

		button.btn-clear:disabled,
		button.btn-send:disabled,
		.homey-button-primary-full:disabled,
		.homey-button-danger-shadow:disabled {
			background-color: #e9f5ed !important;
			color: #6c8c76 !important;
			border-color: #c7dfcf !important;
			box-shadow: none !important;
			opacity: 1 !important;
		}

		.btn-log {
			margin-top: 10px;
		}

		.nowrap-textarea {
			white-space: nowrap;
		}

		.sim-buttons {
			display: flex;
			gap: 5px;
			flex-wrap: wrap;
		}

		.driver-support-wrap {
			display: flex;
			flex-direction: column;
			gap: 14px;
		}

		.driver-support-summary {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
			gap: 10px;
		}

		.driver-support-chip {
			padding: 10px 12px;
			border-radius: 8px;
			background: #f5f6f8;
			border: 1px solid #e1e3e8;
		}

		.driver-support-chip-label {
			display: block;
			font-size: 12px;
			color: #5f6673;
			margin-bottom: 4px;
		}

		.driver-support-chip-value {
			font-size: 18px;
			font-weight: 700;
			color: #1f2530;
		}

		.driver-support-sections {
			display: grid;
			gap: 14px;
		}

		.driver-support-section {
			border: 1px solid #e1e3e8;
			border-left: 4px solid #c9cfdb;
			border-radius: 8px;
			padding: 10px;
			background: #fff;
		}

		.driver-support-section-not-installed {
			border-left-color: #d18400;
			background: #fff9ef;
		}

		.driver-support-section-installed {
			border-left-color: #1d8f4d;
			background: #f3fbf6;
		}

		.driver-support-section-unsupported {
			border-left-color: #768195;
			background: #f7f9fc;
		}

		.driver-support-section-clickable {
			cursor: pointer;
		}

		.driver-support-section h3 {
			margin: 0 0 8px 0;
			font-size: 15px;
			color: #1f2530;
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 8px;
		}

		.driver-support-count-badge {
			display: inline-block;
			padding: 2px 9px;
			border-radius: 999px;
			font-size: 12px;
			font-weight: 700;
			background: #dde2ec;
			color: #2d3442;
		}

		.driver-support-section-not-installed .driver-support-count-badge {
			background: #ffdba0;
			color: #8a5600;
		}

		.driver-support-section-installed .driver-support-count-badge {
			background: #bce7cd;
			color: #0e6735;
		}

		.driver-support-section-unsupported .driver-support-count-badge {
			background: #dce2ec;
			color: #4c5a70;
		}

		.driver-support-group {
			border-top: 1px solid #eceef2;
			padding-top: 8px;
			margin-top: 8px;
		}

		.driver-support-group:first-of-type {
			border-top: 0;
			padding-top: 0;
			margin-top: 0;
		}

		.driver-support-group-row {
			display: grid;
			grid-template-columns: 56px 1fr;
			gap: 10px;
			align-items: start;
		}

		.driver-support-group-content {
			min-width: 0;
		}

		.driver-support-group-title {
			font-weight: 600;
			font-size: 14px;
			color: #2d3442;
			margin-bottom: 5px;
		}

		.driver-support-driver-icon {
			width: 56px;
			height: 56px;
			object-fit: contain;
			border-radius: 6px;
			background: #ffffff;
			border: 1px solid #dde2ea;
			padding: 3px;
			box-sizing: border-box;
			display: block;
		}

		.driver-support-driver-fallback {
			width: 56px;
			height: 56px;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			font-size: 20px;
			background: #e9edf4;
			border: 1px solid #dde2ea;
			border-radius: 6px;
			color: #53607a;
		}

		.driver-support-list {
			margin: 0;
			padding-left: 18px;
		}

		.driver-support-list li {
			margin: 2px 0;
			font-size: 13px;
			color: #303744;
		}

		.driver-support-list-item-row {
			display: inline-flex;
			align-items: center;
			gap: 6px;
		}

		.driver-support-reason-button {
			display: inline-grid;
			place-items: center;
			position: relative;
			width: 22px !important;
			height: 22px !important;
			border-radius: 999px;
			border: 0 !important;
			background: transparent !important;
			color: #315b92 !important;
			font-family: Arial, sans-serif;
			font-size: 18px !important;
			font-weight: 700 !important;
			line-height: 22px;
			-webkit-text-stroke: 0.25px currentColor;
			cursor: pointer;
			padding: 0 !important;
			appearance: none !important;
			-webkit-appearance: none !important;
			transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease, transform 120ms ease;
		}

		.driver-support-reason-button:hover {
			background: #e2ebf7 !important;
			color: #294b7d !important;
			transform: translateY(-1px);
		}

		.driver-support-reason-button:focus {
			outline: 2px solid #88a7d8;
			outline-offset: 1px;
		}

		.driver-support-empty {
			font-size: 13px;
			color: #677083;
		}

		.account-select-row {
			display: flex;
			align-items: center;
			gap: 6px;
			flex-wrap: wrap;
		}

		.account-select-row select {
			flex: 1 1 auto;
			min-width: 180px;
		}

		.icon-button {
			flex: 0 0 auto;
			display: flex;
			align-items: center;
			justify-content: center;
			width: 40px !important;
			height: 40px !important;
			line-height: 1;
			padding: 0;
			border-radius: 6px !important;
			background-color: #baccf0 !important;
			color: #123a23 !important;
			border: 1px solid #78a3ec !important;
			box-shadow: none !important;
			cursor: pointer;
			font-size: 25px !important;
			margin: 5px !important;
		}

		.icon-button:hover {
			background-color: #e9edf3 !important;
		}

		.account-primary-hint {
			font-size: 12px;
			color: #677083;
		}

		.account-modal-actions {
			display: flex;
			gap: 10px;
			flex-wrap: wrap;
		}

		#accountModal .driver-support-modal-content {
			display: flex;
			flex-direction: column;
			gap: 4px;
		}

		#accountModal .field.row {
			display: flex;
			flex-direction: column;
			gap: 4px;
			margin: 0 0 6px 0 !important;
		}

		#accountModal .homey-form-label {
			margin: 0 !important;
		}

		#accountModal .homey-form-checkbox {
			margin: 2px 0 0 0 !important;
		}

		#accountModal .field.row.account-modal-actions {
			flex-direction: row;
			margin-top: 6px !important;
		}

		.driver-support-modal-overlay {
			position: fixed;
			inset: 0;
			background: rgba(18, 26, 38, 0.45);
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 16px;
			z-index: 200;
		}

		.driver-support-modal-overlay.is-hidden {
			display: none;
		}

		.driver-support-modal {
			width: min(560px, 100%);
			max-height: 85vh;
			background: #ffffff;
			border-radius: 12px;
			border: 1px solid #d7deea;
			box-shadow: 0 14px 40px rgba(17, 29, 48, 0.2);
			display: flex;
			flex-direction: column;
			overflow: hidden;
		}

		.driver-support-modal-header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 10px;
			padding: 12px 14px;
			background: #f3f7fd;
			border-bottom: 1px solid #d7deea;
		}

		.driver-support-modal-title {
			font-size: 15px;
			font-weight: 700;
			color: #1f2530;
			margin: 0;
		}

		.driver-support-modal-close {
			border: 0;
			background: transparent;
			font-size: 22px;
			line-height: 1;
			width: 28px;
			height: 28px;
			border-radius: 6px;
			color: #41516b;
			cursor: pointer;
		}

		.driver-support-modal-close:hover {
			background: #e6eef9;
		}

		.driver-support-modal-content {
			padding: 14px;
			overflow: auto;
			white-space: pre-line;
			color: #2a3445;
			font-size: 13px;
			line-height: 1.45;
		}

		.driver-support-modal-content p {
			margin: 0 0 10px 0;
		}

		.driver-support-modal-subheading {
			font-weight: 700;
			color: #1f2530;
			margin: 10px 0 4px 0;
		}

		.driver-support-modal-capability-list {
			list-style: none;
			margin: 0 0 8px 0;
			padding: 0 0 0 12px;
		}

		.driver-support-modal-capability-list li {
			margin: 2px 0;
			padding-left: 8px;
			position: relative;
		}

		.driver-support-modal-capability-list li::before {
			content: '\2022';
			position: absolute;
			left: 0;
			color: #6f7f98;
		}

	</style>

	<script type="text/javascript" src="/homey.js" data-origin="settings"></script>
	<script type="text/javascript" src="busy_indicator.js"></script>
	<link rel="stylesheet" type="text/css" href="lwsa.css">
</head>

<body>
	<!-- Busy indicator -->
	<div id="busybox" class="fog_div">
		<div></div>
	</div>

	<!-- Tab links -->
	<div class="tab">
		<button class="tablinks" onclick="setPage(event, 'settings')" id="defaultOpen" title="Settings"><span data-i18n="settings.settings"></span></button>
		<button class="tablinks" onclick="setPage(event, 'infoLog')" title="Information Log"><span data-i18n="settings.information_log"></span></button>
		<button class="tablinks" onclick="setPage(event, 'deviceLogTab')" title="Device Log"><span data-i18n="settings.device_log"></span></button>
		<button class="tablinks" onclick="setPage(event, 'stateLog')" title="State Log"><span data-i18n="settings.state_log"></span></button>
		<button class="tablinks" onclick="setPage(event, 'eventLog')" title="Event Log"><span data-i18n="settings.event_log"></span></button>
		<button class="tablinks" onclick="setPage(event, 'localTokens')" title="Local Tokens"><span data-i18n="settings.local_tokens"></span></button>
		<button class="tablinks" onclick="setPage(event, 'driverSupport')" title="Driver Support"><span id="driverSupportTabLabel">Driver Support</span></button>
		<button class="tablinks is-hidden" onclick="setPage(event, 'simulator')" id="simLogTab" title="Simulation Data"><span id="simulationTabLabel">Simulation Data</span></button>
	</div>

	<!-- SETTINGS PAGE -->
	<div id="settings" class="tabcontent">
		<fieldset class="homey-form-fieldset">
			<h1 data-i18n="settings.title"></h1>
			<p id="introText" data-i18n="settings.intro"></p>
			<p id="response"></p>
			<fieldset class="homey-form-fieldset">
				<legend class="homey-form-legend" data-i18n="settings.logintitle"></legend>
				<span id="response"></span>
				<div class="field row account-select-row">
					<label class="homey-form-label" for="accountSelect" data-i18n="settings.username"></label>
					<select class="homey-form-select" id="accountSelect" title="Account"></select>
					<button type="button" id="editAccountButton" class="icon-button" title="Edit account">&#9998;</button>
					<button type="button" id="addAccountButton" class="icon-button" title="Add account">&#43;</button>
					<button type="button" id="deleteAccountButton" class="icon-button" title="Delete account">&#128465;</button>
				</div>
				<p id="accountPrimaryHint" class="account-primary-hint"></p>
				<p id="noAccountsHint" class="account-primary-hint is-hidden" data-i18n="settings.no_accounts"></p>
			</fieldset>
	</div>

	<!-- Information LOG PAGE -->
	<div id="infoLog" class="tabcontent">
		<fieldset class="homey-form-fieldset">
			<p data-i18n="settings.intro4"></p>
			<div class="field row">
				<label class="homey-form-checkbox">
					<input class="homey-form-checkbox-input" id="InfoLogEnabled" type="checkbox" value="logEnabled" title="Enable information log" />
					<span class="homey-form-checkbox-checkmark"></span>
					<span class="homey-form-checkbox-text"><span data-i18n="settings.log_enabled"></span></span>
				</label>
			</div>
			<button id="clearInfoLog" class="btn-clear" data-i18n="settings.clear" title="Clear information log"></button>
			<button id="sendInfoLog" class="btn-send" data-i18n="settings.send" title="Send information log"></button>
			<div class="field row">
				<textarea id="infoLogData" class="nowrap-textarea" title="Information log data"></textarea>
			</div>
		</fieldset>
	</div>

	<!-- DEVICE LOG PAGE -->
	<div id="deviceLogTab" class="tabcontent">
		<fieldset class="homey-form-fieldset">
			<p data-i18n="settings.intro1"></p>
			<p data-i18n="settings.intro2"></p>
			<p data-i18n="settings.intro3"></p>
			<p data-i18n="settings.intro4"></p>
			<p>
				<button id="getDeviceLog" class="btn-send btn-log" data-i18n="settings.get" title="Get device log"></button>
				<button id="clearDeviceLog" class="btn-clear btn-log" data-i18n="settings.clear" title="Clear device log"></button>
				<button id="sendDeviceLog" class="btn-send btn-log" data-i18n="settings.send" title="Send device log"></button>
			</p>
			<div class="field row">
				<textarea id="deviceLog" class="nowrap-textarea" title="Device log data"></textarea>
			</div>
		</fieldset>
	</div>

	<!--SIMULATION PAGE -->
	<div id="simulator" class="tabcontent">
		<fieldset class="homey-form-fieldset">
			<h1 id="simulatorDebugTitle">For debug use only</h1>
			<p class="sim-buttons"><button id="useSim" class="btn-send" title="Activate simulation">Activate</button><button id="clearSim" class="btn-clear" title="Clear simulation">Clear Sim</button></p>
			<div class="field row">
				<textarea id="simData" class="nowrap-textarea" title="Simulation data"></textarea>
			</div>
		</fieldset>
	</div>

	<!--STATE LOG PAGE -->
	<div id="stateLog" class="tabcontent">
		<fieldset class="homey-form-fieldset">
			<div class="field row">
				<label class="homey-form-checkbox">
					<input class="homey-form-checkbox-input" id="stateLogEnabled" type="checkbox" value="logEnabled" title="Enable state log" />
					<span class="homey-form-checkbox-checkmark"></span>
					<span class="homey-form-checkbox-text"><span data-i18n="settings.log_enabled"></span></span>
				</label>
			</div>
			<button id="clearStateLog" class="btn-clear btn-log" data-i18n="settings.clear" title="Clear state log"></button>
			<div class="field row">
				<textarea id="stateLogData" class="nowrap-textarea" title="State log data"></textarea>
			</div>
		</fieldset>
	</div>

	<!--EVENT LOG PAGE -->
	<div id="eventLog" class="tabcontent">
		<fieldset class="homey-form-fieldset">
			<p data-i18n="settings.intro4"></p>
			<div class="field row">
				<label class="homey-form-checkbox">
					<input class="homey-form-checkbox-input" id="eventLogEnabled" type="checkbox" value="logEnabled" title="Enable event log" />
					<span class="homey-form-checkbox-checkmark"></span>
					<span class="homey-form-checkbox-text"><span data-i18n="settings.log_enabled"></span></span>
				</label>
			</div>
			<button id="clearEventLog" class="btn-clear btn-log" data-i18n="settings.clear" title="Clear event log"></button>
			<button id="sendEventLog" class="btn-send" data-i18n="settings.send" title="Send event log"></button>
			<div class="field row">
				<textarea id="eventLogData" class="nowrap-textarea" title="Event log data"></textarea>
			</div>
		</fieldset>
	</div>

	<!--LOCAL TOKENS PAGE -->
	<div id="localTokens" class="tabcontent">
		<fieldset class="homey-form-fieldset">
			<p data-i18n="settings.intro5"></p>
			<div class="homey-form-group">
				<div class="field row">
					<label class="homey-form-label" for="localTokenUUIDElement" data-i18n="settings.token_id"></label>
					<input class="homey-form-input" id="localTokenUUIDElement" type="text" value="" title="Token UUID to delete" />
				</div>
				<button id="deleteLocalToken" class="btn-send" data-i18n="settings.delete_token" title="Delete local token"></button>
			</div>
			<button id="getLocalTokens" class="btn-send" data-i18n="settings.get_tokens" title="Refresh token list"></button>
			<div class="field row">
				<textarea id="localTokensData" class="nowrap-textarea" title="Local token data"></textarea>
			</div>
		</fieldset>
	</div>

	<!--DRIVER SUPPORT PAGE -->
	<div id="driverSupport" class="tabcontent">
		<div class="homey-form-fieldset driver-support-wrap">
			<div id="driverSupportSummary" class="driver-support-summary"></div>
			<div id="driverSupportView" class="driver-support-sections"></div>
		</div>
	</div>

	<div id="driverSupportReasonModal" class="driver-support-modal-overlay is-hidden" role="dialog" aria-modal="true" aria-labelledby="driverSupportReasonTitle">
		<div class="driver-support-modal">
			<div class="driver-support-modal-header">
				<h3 id="driverSupportReasonTitle" class="driver-support-modal-title">Driver recommendation details</h3>
				<button id="driverSupportReasonCloseTop" class="driver-support-modal-close" type="button" aria-label="Close">&times;</button>
			</div>
			<div id="driverSupportReasonContent" class="driver-support-modal-content"></div>
		</div>
	</div>

	<div id="accountModal" class="driver-support-modal-overlay is-hidden" role="dialog" aria-modal="true" aria-labelledby="accountModalTitle">
		<div class="driver-support-modal">
			<div class="driver-support-modal-header">
				<h3 id="accountModalTitle" class="driver-support-modal-title" data-i18n="settings.add_account"></h3>
				<button id="accountModalClose" class="driver-support-modal-close" type="button" aria-label="Close">&times;</button>
			</div>
			<div class="driver-support-modal-content">
				<p id="accountModalResponse"></p>
				<div class="field row">
					<label class="homey-form-label" for="accountUsername" data-i18n="settings.username"></label>
					<input class="homey-form-input" id="accountUsername" type="text" value="" title="Username" />
				</div>
				<div class="field row">
					<label class="homey-form-label" for="accountPassword" data-i18n="settings.password"></label>
					<input class="homey-form-input" id="accountPassword" type="password" value="" title="Password" />
					<label class="homey-form-checkbox">
						<input class="homey-form-checkbox-input" id="accountShowPassword" type="checkbox" value="showPassword" title="Show password" />
						<span class="homey-form-checkbox-checkmark"></span>
						<span class="homey-form-checkbox-text"><span data-i18n="settings.show_password"></span></span>
					</label>
				</div>
				<div class="field row">
					<label class="homey-form-label" for="accountLocalToken" data-i18n="settings.localToken"></label>
					<input class="homey-form-input" id="accountLocalToken" type="text" value="" title="Local token" />
				</div>
				<div class="field row">
					<label class="homey-form-label" for="accountRegion" data-i18n="settings.region"></label>
					<select class="homey-form-select" id="accountRegion" title="Region">
						<option value="europe" data-i18n="settings.europe"></option>
						<option value="usa" data-i18n="settings.usa"></option>
						<option value="oceana" data-i18n="settings.oceana"></option>
					</select>
				</div>
				<div class="field row">
					<label class="homey-form-checkbox">
						<input class="homey-form-checkbox-input" id="accountSetPrimary" type="checkbox" value="setPrimary" title="Set as primary account" />
						<span class="homey-form-checkbox-checkmark"></span>
						<span class="homey-form-checkbox-text"><span data-i18n="settings.set_primary_account"></span></span>
					</label>
				</div>
				<div class="field row account-modal-actions">

		function closeDriverSupportReasonModal()
		{
			driverSupportReasonModalElement.classList.add('is-hidden');
		}

		function escapeHtml(text)
		{
			return String(text || '')
				.replace(/&/g, '&amp;')
				.replace(/</g, '&lt;')
				.replace(/>/g, '&gt;')
				.replace(/"/g, '&quot;')
				.replace(/'/g, '&#39;');
		}

		function formatDriverSupportReasonHtml(reason)
		{
			var buildCapabilitiesListHtml = function(rawText)
			{
				var values = String(rawText || '')
					.split(',')
					.map(function(item)
					{
						return String(item || '').trim();
					})
					.filter(function(item)
					{
						return item.length > 0;
					});

				if ((values.length === 0) || ((values.length === 1) && (values[0].toLowerCase() === 'none')))
				{
					values = [tr('settings.none', 'None')];
				}

				return `<ul class="driver-support-modal-capability-list">${values.map(function(item)
				{
					return `<li>${escapeHtml(item)}</li>`;
				}).join('')}</ul>`;
			};

			var lines = String(reason || '').split('\n');
			if (lines.length === 0)
			{
				return `<p>${escapeHtml(tr('settings.no_data', 'No data'))}</p>`;
			}

			var htmlParts = [];
			lines.forEach(function(line)
			{
				var raw = String(line || '');
				if (!raw.trim())
				{
					return;
				}

				if (raw.indexOf('Matched capabilities:') === 0)
				{
					var matchedText = raw.substring('Matched capabilities:'.length).trim();
					htmlParts.push('<div class="driver-support-modal-subheading">Matched capabilities</div>');
					htmlParts.push(buildCapabilitiesListHtml(matchedText));
					return;
				}

				if (raw.indexOf('Unmatched capabilities:') === 0)
				{
					var unmatchedText = raw.substring('Unmatched capabilities:'.length).trim();
					htmlParts.push('<div class="driver-support-modal-subheading">Unmatched capabilities</div>');
					htmlParts.push(buildCapabilitiesListHtml(unmatchedText));
					return;
				}

				htmlParts.push(`<p>${escapeHtml(raw)}</p>`);
			});

			if (htmlParts.length === 0)
			{
				return `<p>${escapeHtml(tr('settings.no_data', 'No data'))}</p>`;
			}

			return htmlParts.join('');
		}

		function openDriverSupportReasonModal(deviceName, reason)
		{
			var titlePrefix = tr('settings.driver_support_recommendation_reason_title', 'Why this driver was selected');
			driverSupportReasonTitleElement.textContent = `${titlePrefix} - ${deviceName}`;
			driverSupportReasonContentElement.innerHTML = formatDriverSupportReasonHtml(reason);
			driverSupportReasonModalElement.classList.remove('is-hidden');
		}

		var lastAccountsList = [];

		function loadAccountSessions(selectUsername)
		{
			Homey.api('POST', '/ListAccountSessions/', {}, function(err, accounts)
			{
				if (err)
				{
					return Homey.alert(err);
				}

				accounts = Array.isArray(accounts) ? accounts : [];
				lastAccountsList = accounts;
				accountSelectEl.innerHTML = '';

				if (accounts.length === 0)
				{
					noAccountsHintEl.classList.remove('is-hidden');
					accountPrimaryHintEl.textContent = '';
					editAccountButton.disabled = true;
					deleteAccountButton.disabled = true;
					return;
				}

				noAccountsHintEl.classList.add('is-hidden');
				editAccountButton.disabled = false;
				deleteAccountButton.disabled = false;

				accounts.forEach(function(account)
				{
					var option = document.createElement('option');
					option.value = account.username;
					option.textContent = account.isPrimary ? `${account.username} (${tr('settings.primary_account', 'Primary')})` : account.username;
					accountSelectEl.appendChild(option);
				});

				var usernameToSelect = selectUsername || accountSelectEl.value;
				if (usernameToSelect && accounts.some(function(account) { return account.username === usernameToSelect; }))
				{
					accountSelectEl.value = usernameToSelect;
				}

				updatePrimaryHint(accounts);
			});
		}

		function updatePrimaryHint(accounts)
		{
			var selected = accounts.find(function(account) { return account.username === accountSelectEl.value; });
			if (selected && selected.isPrimary)
			{
				accountPrimaryHintEl.textContent = tr('settings.primary_account_hint', 'This is the primary account.');
			}
			else
			{
				accountPrimaryHintEl.textContent = '';
			}
		}

		function openAccountModal(mode, username)
		{
			accountModalMode = mode;
			accountModalOriginalUsername = (mode === 'edit') ? username : '';
			accountModalResponseEl.textContent = '';
			accountModalResponseEl.style.color = '';
			accountModalTitleEl.textContent = (mode === 'edit')
				? tr('settings.edit_account', 'Edit account')
				: tr('settings.add_account', 'Add account');
			accountPasswordEl.type = 'password';

			if (mode === 'edit')
			{
				Homey.api('POST', '/GetAccountSession/', { username: username }, function(err, details)
				{
					if (err)
					{
						return Homey.alert(err);
					}

					accountUsernameEl.value = details.username || '';
					accountPasswordEl.value = details.password || '';
					accountLocalTokenEl.value = details.localToken || '';
					accountRegionEl.value = details.region || 'europe';
					accountSetPrimaryEl.checked = !!details.isPrimary;
					accountSetPrimaryEl.disabled = !!details.isPrimary;
					accountModalEl.classList.remove('is-hidden');
				});
			}
			else
			{
				accountUsernameEl.value = '';
				accountPasswordEl.value = '';
				accountLocalTokenEl.value = '';
				accountRegionEl.value = 'europe';
				accountSetPrimaryEl.checked = false;
				accountSetPrimaryEl.disabled = false;
				accountModalEl.classList.remove('is-hidden');
			}
		}

		function closeAccountModal()
		{
			accountModalEl.classList.add('is-hidden');
		}

		function saveAccount()
		{
			var payload = {
				originalUsername: accountModalOriginalUsername,
				username: accountUsernameEl.value.trim(),
				password: accountPasswordEl.value,
				region: accountRegionEl.value,
				localToken: accountLocalTokenEl.value,
				setPrimary: accountSetPrimaryEl.checked,
			};

			if (!payload.username || !payload.password)
			{
				accountModalResponseEl.style.color = 'red';
				accountModalResponseEl.textContent = tr('settings.login_failure', 'Login failed');
				return;
			}

			Object.values(document.querySelectorAll('*')).forEach(element => element.style.cursor = "wait");
			accountModalResponseEl.style.color = '';
			accountModalResponseEl.textContent = __('settings.save_verifying');

			Homey.api('POST', '/SaveAccountSession/', payload, function(err, result)
			{
				Object.values(document.querySelectorAll('*')).forEach(element => element.style.cursor = "default");
				if (err)
				{
					accountModalResponseEl.style.color = 'red';
					accountModalResponseEl.textContent = __('settings.login_failure') + '<br/>' + (err.message || err);
					return;
				}

				closeAccountModal();
				loadAccountSessions(payload.username);
			});
		}

		function deleteAccount(username, force, closeModalAfter)
		{
			Homey.api('POST', '/DeleteAccountSession/', { username: username, force: !!force }, function(err, result)
			{
				if (err)
				{
					response.style.color = 'red';
					response.innerHTML = err.message || err;
					return;
				}

				if (result && result.inUse && !force)
				{
					var deviceNames = (result.usage && Array.isArray(result.usage.devices))
						? result.usage.devices.map(function(device) { return device.name; }).join(', ')
						: '';
					var confirmMessage = tr('settings.delete_account_in_use', 'This account is still used by devices ({devices}). Delete anyway?').replace('{devices}', deviceNames);
					if (confirm(confirmMessage))
					{
						deleteAccount(username, true, closeModalAfter);
					}
					return;
				}

				if (closeModalAfter)
				{
					closeAccountModal();
				}

				response.style.color = 'green';
				response.innerHTML = __('settings.delete_account_success');
				loadAccountSessions();
			});
		}

			var translated = __(key);
			if (!translated || translated === key)

			}

			return translated;

			deleteAccountButton.addEventListener('click', function()

		function setPage(evt, tabPage)
		{
			var i, tabcontent, tablinks;

			// Get all elements with class="tabcontent" and hide them
			tabcontent = document.getElementsByClassName("tabcontent");
			for (i = 0; i < tabcontent.length; i++)
			{
				tabcontent[i].style.display = "none";
			}

			// Get all elements with class="tablinks" and remove the class "active"
			tablinks = document.getElementsByClassName("tablinks");
			for (i = 0; i < tablinks.length; i++)
			{
				tablinks[i].className = tablinks[i].className.replace(" active", "");
			}

			// Show the current tab, and add an "active" class to the button that opened the tab
			document.getElementById(tabPage).style.display = "block";
			evt.currentTarget.className += " active";
			if (tabPage == 'infoLog')
			{
				// Refresh the log data
				Homey.get('infoLog', function(err, infoLog)
				{
					if (err) return Homey.alert(err);
					let logData = infoLog ? JSON.stringify(infoLog, null, 2) : "";
					logData = logData.replace(/\\n/g, '\n			 ').replace(/\\"/g, '"');
					infoLogElement.value = logData;
				});
				Homey.get('infoLogEnabled', function(err, enable)
				{
					if (err) return Homey.alert(err);
					infoLogEnabledElement.checked = enable;
				});
				// Make the log text area fill the page
				infoLogElement.setAttribute('cols', infoLogElement.parentElement.clientWidth / 8);
				infoLogElement.style.height = (window.innerHeight - infoLogElement.offsetTop - 40) + 'px';
			}

			if (tabPage == 'deviceLogTab')
			{
				// Refresh the log data
				Homey.get('deviceLog', function(err, deviceLog)
				{
					if (err) return Homey.alert(err);
					deviceLogElement.value = deviceLog ? JSON.stringify(deviceLog, null, 2) : "";
				});
				// Make the log text area fill the page
				deviceLogElement.setAttribute('cols', deviceLogElement.parentElement.clientWidth / 8);
				deviceLogElement.style.height = (window.innerHeight - deviceLogElement.offsetTop - 40) + 'px';
			}

			if (tabPage == 'simulator')
			{
				Homey.get('simData', function(err, simData)
				{
					if (err) return Homey.alert(err);
					simDataElement.value = simData ? JSON.stringify(simData, null, 2) : "";
				});
				// Make the simulator text box fill the page
				simDataElement.setAttribute('cols', simDataElement.parentElement.clientWidth / 8);
				simDataElement.style.height = (window.innerHeight - simDataElement.offsetTop - 40) + 'px';
			}

			if (tabPage == 'stateLog')
			{
				Homey.get('stateLog', function(err, stateLogData)
				{
					if (err) return Homey.alert(err);
					stateLogElement.value = stateLogData;
				});
				Homey.get('stateLogEnabled', function(err, enable)
				{
					if (err) return Homey.alert(err);
					stateLogEnabledElement.checked = enable;
				});
				// Make the simulator text box fill the page
				stateLogElement.setAttribute('cols', stateLogElement.parentElement.clientWidth / 8);
				stateLogElement.style.height = (window.innerHeight - stateLogElement.offsetTop - 40) + 'px';
			}

			if (tabPage == 'eventLog')
			{
				Homey.get('eventLog', function(err, eventLogData)
				{
					if (err) return Homey.alert(err);
					eventLogElement.value = eventLogData;
				});
				Homey.get('eventLogEnabled', function(err, enable)
				{
					if (err) return Homey.alert(err);
					eventLogEnabledElement.checked = enable;
				});
				// Make the simulator text box fill the page
				eventLogElement.setAttribute('cols', eventLogElement.parentElement.clientWidth / 8);
				eventLogElement.style.height = (window.innerHeight - eventLogElement.offsetTop - 40) + 'px';
			}

			if (tabPage == 'localTokens')
			{
				Homey.api('POST', '/GetLocalTokens/', {}, function(err, result)
				{
					waitCursor(false);

					if (err)
					{
						localTokensElement.value = err;
						return;
					}
					localTokensElement.value = result;
				});

				// Make the text box fill the page
				localTokensElement.setAttribute('cols', localTokensElement.parentElement.clientWidth / 8);
				localTokensElement.style.height = (window.innerHeight - localTokensElement.offsetTop - 40) + 'px';
			}

			if (tabPage == 'driverSupport')
			{
				refreshDriverSupport();
			}
		}

		function refreshDriverSupport()
		{
			waitCursor(true);
			Homey.api('POST', '/GetDriverSupportMatrix/', {}, function(err, result)
			{
				waitCursor(false);

				if (err)
				{
					renderDriverSupportError(`${tr('settings.driver_support_fetch_failed', 'Failed to fetch driver support data')}: ${err.message || err}`);
					return;
				}

				renderDriverSupport(result);
			});
		}

			function renderDriverSupportError(message)
			{
				driverSupportSummaryElement.innerHTML = '';
				driverSupportViewElement.innerHTML = '';

				var section = document.createElement('section');
				section.className = 'driver-support-section';
				var title = document.createElement('h3');
				title.textContent = tr('settings.driver_support_tab', 'Driver Support');
				section.appendChild(title);

				var body = document.createElement('p');
				body.className = 'driver-support-empty';
				body.textContent = message;
				section.appendChild(body);

				driverSupportViewElement.appendChild(section);
			}

			function renderDriverSupport(result)
		{
			if (!result)
			{
					renderDriverSupportError(tr('settings.no_data', 'No data'));
					return;
			}

			if (result.hasConnectedSession === false)
			{
				renderDriverSupportError(tr('settings.driver_support_connect_login', 'Please save your login credentials in the settings tab to connect to your account'));
				return;
			}

				driverSupportSummaryElement.innerHTML = '';
				driverSupportViewElement.innerHTML = '';

				var summaryItems = [
					{ label: tr('settings.driver_support_generated', 'Generated'), value: result.generatedAt || '-' },
					{ label: tr('settings.driver_support_somfy_devices', 'Somfy devices'), value: result.totalSomfyDevices || 0 },
					{ label: tr('settings.driver_support_matched_drivers', 'Matched drivers'), value: result.totalMatchedDrivers || 0 },
					{ label: tr('settings.driver_support_supported_not_added', 'Supported not added to Homey'), value: result.totalSupportedNotInstalled || 0 },
					{ label: tr('settings.driver_support_supported_added', 'Supported already added to Homey'), value: result.totalSupportedInstalled || 0 },
					{ label: tr('settings.driver_support_unsupported', 'Unsupported'), value: result.totalUnsupported || 0 }
				];

				summaryItems.forEach(function(item)
				{
					var chip = document.createElement('div');
					chip.className = 'driver-support-chip';

					var chipLabel = document.createElement('span');
					chipLabel.className = 'driver-support-chip-label';
					chipLabel.textContent = item.label;
					chip.appendChild(chipLabel);

					var chipValue = document.createElement('span');
					chipValue.className = 'driver-support-chip-value';
					chipValue.textContent = item.value;
					chip.appendChild(chipValue);

					driverSupportSummaryElement.appendChild(chip);
				});

			var recommendations = Array.isArray(result.recommendations) ? result.recommendations : [];
			var appBasePath = (function()
			{
				var marker = '/settings/';
				var idx = window.location.pathname.indexOf(marker);
				return idx >= 0 ? window.location.pathname.substring(0, idx) : '';
			})();

			var buildDriverIconCandidates = function(driverId, iconPath)
			{
				var id = String(driverId || '').trim();
				var candidates = [];

				if (iconPath)
				{
					candidates.push(String(iconPath));
				}

				if (id)
				{
					var canonical = `/drivers/${id}/assets/icon.svg`;
					candidates.push(canonical);
					if (appBasePath)
					{
						candidates.push(`${appBasePath}${canonical}`);
					}
					candidates.push(`../drivers/${id}/assets/icon.svg`);
				}

				var unique = [];
				var seen = {};
				candidates.forEach(function(candidate)
				{
					if (!candidate || seen[candidate])
					{
						return;
					}
					seen[candidate] = true;
					unique.push(candidate);
				});

				return unique;
			};

			var createDriverIconElement = function(driverId, iconPath)
			{
				var candidates = buildDriverIconCandidates(driverId, iconPath);
				if (candidates.length === 0)
				{
					var noIcon = document.createElement('span');
					noIcon.className = 'driver-support-driver-fallback';
					noIcon.textContent = '\u25A3';
					return noIcon;
				}

				var icon = document.createElement('img');
				icon.className = 'driver-support-driver-icon';
				icon.alt = '';
				var index = 0;

				var tryNext = function()
				{
					if (index >= candidates.length)
					{
						var fallback = document.createElement('span');
						fallback.className = 'driver-support-driver-fallback';
						fallback.textContent = '\u25A3';
						icon.replaceWith(fallback);
						return;
					}

					icon.src = candidates[index];
					index += 1;
				};

				icon.onerror = tryNext;
				tryNext();
				return icon;
			};

			var supported = recommendations.filter(function(item)
			{
				return !!item.recommendedDriverId;
			});
			var supportedNotInstalled = supported.filter(function(item)
			{
				return !item.isInstalled;
			});
			var supportedInstalled = supported.filter(function(item)
			{
				return !!item.isInstalled;
			});
			var unsupported = recommendations.filter(function(item)
			{
				return !item.recommendedDriverId;
			});

			var createSection = function(title, count, modifierClass)
			{
				var section = document.createElement('section');
				section.className = modifierClass ? `driver-support-section ${modifierClass}` : 'driver-support-section';

				var header = document.createElement('h3');
				var headerText = document.createElement('span');
				headerText.textContent = title;
				header.appendChild(headerText);

				var badge = document.createElement('span');
				badge.className = 'driver-support-count-badge';
				badge.textContent = count;
				header.appendChild(badge);
				section.appendChild(header);

				return section;
			};

			var formatCapabilityList = function(list)
			{
				if (!Array.isArray(list) || list.length === 0)
				{
					return tr('settings.none', 'None');
				}

				return list.join(', ');
			};

			var getSelectedCandidate = function(item)
			{
				if (!item || !Array.isArray(item.candidates) || !item.recommendedDriverId)
				{
					return null;
				}

				for (var i = 0; i < item.candidates.length; i++)
				{
					var candidate = item.candidates[i];
					if (candidate && candidate.driverId === item.recommendedDriverId)
					{
						return candidate;
					}
				}

				return null;
			};

			var buildRecommendationReason = function(item)
			{
				var candidate = getSelectedCandidate(item);
				if (!candidate)
				{
					return '';
				}

				var matched = Array.isArray(candidate.matchedCapabilities) ? candidate.matchedCapabilities : [];
				var unmatched = Array.isArray(candidate.unmatchedCapabilities) ? candidate.unmatchedCapabilities : [];
				var ratio = Number(candidate.compatibilityRatio || 0);
				if ((ratio <= 0) && ((matched.length + unmatched.length) > 0))
				{
					ratio = matched.length / (matched.length + unmatched.length);
				}

				var percent = Math.round(ratio * 100);
				var lines = [
					`Matched controllable name: ${candidate.matchedControllableName}`,
					`Controllable-name match: +${candidate.baseScore} points`,
					`Capability adjustment (including coverage bonus): ${candidate.score - candidate.baseScore} points`,
					`Match score: ${candidate.score}`,
					`Capability evidence: ${percent}%`,
					'The controllable name identifies a supported driver. Capability checks are heuristic; unmatched capabilities do not necessarily mean unsupported features.',
					`Matched capabilities: ${formatCapabilityList(matched)}`,
					`Unmatched capabilities: ${formatCapabilityList(unmatched)}`,
				];

				return lines.join('\n');
			};

			var appendSupportedSection = function(title, items)
			{
				var modifierClass = title === tr('settings.driver_support_supported_not_added', 'Supported but not added to Homey')
					? 'driver-support-section-not-installed'
					: 'driver-support-section-installed';
				var section = createSection(title, items.length, modifierClass);
				if (items.length === 0)
				{
					var empty = document.createElement('p');
					empty.className = 'driver-support-empty';
					empty.textContent = tr('settings.none', 'None');
					section.appendChild(empty);
					driverSupportViewElement.appendChild(section);
					return;
				}

				var supportedByDriver = {};
				items.forEach(function(item)
				{
					var driverKey = item.recommendedDriverId;
					if (!supportedByDriver[driverKey])
					{
						supportedByDriver[driverKey] =
						{
							driverId: item.recommendedDriverId,
							driverName: item.recommendedDriverName || tr('settings.unknown_driver', 'Unknown driver'),
							driverIcon: item.recommendedDriverIcon || '',
							devices: [],
							seenDeviceKeys: {},
						};
					}

					var deviceName = item.label || item.deviceURL || '-';
					var deviceKey = `${item.oid || ''}|${item.deviceURL || ''}|${deviceName}`;
					if (supportedByDriver[driverKey].seenDeviceKeys[deviceKey])
					{
						return;
					}

					supportedByDriver[driverKey].seenDeviceKeys[deviceKey] = true;
					supportedByDriver[driverKey].devices.push(
						{
							name: deviceName,
							reason: buildRecommendationReason(item),
						},
					);
				});

				var supportedDriverGroups = Object.values(supportedByDriver)
					.sort(function(a, b)
					{
						return a.driverName.localeCompare(b.driverName);
					});

				supportedDriverGroups.forEach(function(group)
				{
					var groupBox = document.createElement('div');
					groupBox.className = 'driver-support-group';

					var row = document.createElement('div');
					row.className = 'driver-support-group-row';

					row.appendChild(createDriverIconElement(group.driverId, group.driverIcon));

					var content = document.createElement('div');
					content.className = 'driver-support-group-content';

					var groupTitle = document.createElement('div');
					groupTitle.className = 'driver-support-group-title';

					var titleText = document.createElement('span');
					titleText.textContent = group.driverName;
					groupTitle.appendChild(titleText);
					content.appendChild(groupTitle);

					var list = document.createElement('ul');
					list.className = 'driver-support-list';
					group.devices.sort(function(a, b)
					{
						return a.name.localeCompare(b.name);
					}).forEach(function(device)
					{
						var li = document.createElement('li');

						var row = document.createElement('span');
						row.className = 'driver-support-list-item-row';

						var label = document.createElement('span');
						label.textContent = device.name;
						row.appendChild(label);

						if (device.reason)
						{
							li.title = device.reason;

							var reasonButton = document.createElement('button');
							reasonButton.type = 'button';
							reasonButton.className = 'driver-support-reason-button';
								reasonButton.textContent = '\u24d8';
							reasonButton.title = tr('settings.driver_support_recommendation_reason_title', 'Why this driver was selected');
							reasonButton.setAttribute('aria-label', tr('settings.driver_support_recommendation_reason_title', 'Why this driver was selected'));
							reasonButton.addEventListener('click', function(event)
							{
								event.preventDefault();
								event.stopPropagation();
								openDriverSupportReasonModal(device.name, device.reason);
							});

							row.appendChild(reasonButton);
						}

						li.appendChild(row);
						list.appendChild(li);
					});
					content.appendChild(list);

					row.appendChild(content);
					groupBox.appendChild(row);
					section.appendChild(groupBox);
				});

				driverSupportViewElement.appendChild(section);
			};

			appendSupportedSection(tr('settings.driver_support_supported_not_added', 'Supported but not added to Homey'), supportedNotInstalled);
			appendSupportedSection(tr('settings.driver_support_supported_added', 'Supported and already added to Homey'), supportedInstalled);

			var unsupportedSection = createSection(tr('settings.driver_support_unsupported_devices', 'Unsupported devices'), unsupported.length, 'driver-support-section-unsupported');
			if (unsupported.length > 0)
			{
				unsupportedSection.classList.add('driver-support-section-clickable');
				unsupportedSection.title = tr('settings.driver_support_send_unsupported_title', 'Click to send unsupported device information to the developer');
				unsupportedSection.addEventListener('click', function()
				{
					Homey.confirm(tr('settings.confirm_send_unsupported_devices', 'Would you like to send the information about these device to the developer so support can be considere?'), null, function(confirmErr, ok)
					{
						if (confirmErr || !ok)
						{
							return;
						}

						waitCursor(true);
						Homey.api('POST', '/SendUnsupportedDevices/',
						{
							unsupportedDevices: unsupported.map(function(item)
							{
								return {
									label: item.label || item.deviceURL || '-',
									deviceURL: item.deviceURL || '',
									oid: item.oid || '',
									controllableName: item.controllableName || '',
									source: item.source || '',
									session: item.session || '',
									availableCommands: Array.isArray(item.commands) ? item.commands : [],
									states: Array.isArray(item.states) ? item.states : [],
									somfyDevice: item.somfyDevice || {},
								};
							}),
						}, function(apiErr, response)
						{
							waitCursor(false);
							if (apiErr)
							{
								Homey.alert(apiErr);
								return;
							}

							Homey.alert(`${tr('settings.log_sent_with_id_prefix', 'Log sent successfully. Please contact @Adrian_Rockall on the forum with the log ID: ')}${response.message}${tr('settings.log_sent_with_id_suffix', ' and explain the issue')}`);
						});
					});
				});

				var unsupportedList = document.createElement('ul');
				unsupportedList.className = 'driver-support-list';
				unsupported.forEach(function(item)
				{
					var li = document.createElement('li');
					li.textContent = item.label || item.deviceURL || '-';
					unsupportedList.appendChild(li);
				});
				unsupportedSection.appendChild(unsupportedList);
			}
			else
			{
				var unsupportedEmpty = document.createElement('p');
				unsupportedEmpty.className = 'driver-support-empty';
				unsupportedEmpty.textContent = tr('settings.none', 'None');
				unsupportedSection.appendChild(unsupportedEmpty);
			}
			driverSupportViewElement.appendChild(unsupportedSection);

			if (recommendations.length === 0)
			{
				var noDataSection = document.createElement('section');
				noDataSection.className = 'driver-support-section';
				var noDataText = document.createElement('p');
				noDataText.className = 'driver-support-empty';
				noDataText.textContent = tr('settings.driver_support_no_matching_devices', 'No Somfy devices were available for matching.');
				noDataSection.appendChild(noDataText);
				driverSupportViewElement.appendChild(noDataSection);
			}
		}

		function waitCursor(On)
		{
			if (On)
			{
				busyi.show();
			}
			else
			{
				busyi.hide();
			}
		}
	</script>
